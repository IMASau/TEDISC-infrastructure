---
# R libraries installed system-wide, into the site library. Project-level
# dependencies are better pinned with renv inside the project itself; this is
# for things every user of the box needs.
r_lang_packages: []
r_lang_github_packages: ["joekirincic/dagsterpipes"]

# Build deps for CRAN packages with no binary available. Covers the usual
# tidyverse/devtools surface — curl/openssl/xml2 for the web stack, and the
# font and image libraries that ragg, systemfonts and textshaping need.
r_lang_build_deps:
  - build-essential
  - libcurl4-openssl-dev
  - libssl-dev
  - libxml2-dev
  - libfontconfig1-dev
  - libharfbuzz-dev
  - libfribidi-dev
  - libfreetype6-dev
  - libpng-dev
  - libtiff5-dev
  - libjpeg-dev

# The VM's firewall only lets a handful of hosts out. AARNet mirrors the whole
# CRAN tree, so both the R apt repo (bin/linux/ubuntu) and install.packages()
# source tarballs come from here. No trailing slash.
r_lang_cran_mirror: "https://mirror.aarnet.edu.au/pub/CRAN"

# Posit's package manager serves prebuilt Ubuntu binaries, sparing this VM
# from compiling every install.packages() call from source. Off by default:
# packagemanager.posit.co is not on the firewall allow-list, so packages are
# built from source via r_lang_cran_mirror instead. Flip to true if Posit is
# ever permitted.
r_lang_use_posit_binaries: false
