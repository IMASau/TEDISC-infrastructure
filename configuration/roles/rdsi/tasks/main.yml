---
# Mount RDSI directory:
- name: Create directory for RDSI mount point
  ansible.builtin.file:
    path: /mnt/rdsi
    state: directory
    owner: "{{ processing_user }}"
    group: "{{ processing_user_group }}"
    mode: "0775"

- name: Ensure RDSI is mounted
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ rdsi_nfs_server }}:{{ rdsi_nfs_folder }} /mnt/rdsi nfs rw,nosuid,noexec,nodev,hard,intr,bg,proto=tcp 0 0"
