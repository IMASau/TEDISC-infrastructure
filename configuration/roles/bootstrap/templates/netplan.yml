network:
  version: 2
  ethernets:
    eth1:
      dhcp4: true
      dhcp4-overrides:
        use-routes: false  # Prevents DHCP from overriding the default route on eth0
      routes:
        - to: {{ dagster_vlan_ip }}/32
          via: {{ processing_vlan_gateway }}
        - to: default
          via: {{ processing_vlan_gateway }}
          table: 100
      routing-policy:
        - from: {{ processing_vlan_ip }}
          table: 100
