---
# Base packages Ansible itself needs on a minimal Nectar Ubuntu image before
# any other role can safely run. Kept intentionally tiny — actual services
# live in their own roles.

# Must come first: nothing below (or in any later role) can apt-get anything
# until the sources point at a host the firewall lets through. Written with
# `copy` rather than `deb822_repository` because the latter needs
# python3-debian, which we can't install until apt works.
- name: Point apt at the permitted Ubuntu mirror
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ubuntu.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (bootstrap role). Upstream archive.ubuntu.com and
      # security.ubuntu.com are blocked by the firewall; the mirror carries
      # all four pockets.
      Types: deb
      URIs: {{ bootstrap_apt_mirror }}
      Suites: {{ ansible_distribution_release }} {{ ansible_distribution_release }}-updates {{ ansible_distribution_release }}-backports {{ ansible_distribution_release }}-security
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
  register: bootstrap_apt_sources

# Noble images ship a comment-only sources.list that defers to ubuntu.sources,
# but older images (and some cloud-init datasources) still populate it with
# upstream URLs. Blank it so there is exactly one source of truth.
- name: Neutralise the legacy sources.list
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (bootstrap role). Ubuntu sources live in
      # /etc/apt/sources.list.d/ubuntu.sources
  register: bootstrap_apt_sources_legacy

- name: Refresh apt cache after changing the mirror
  ansible.builtin.apt:
    update_cache: true
  when: bootstrap_apt_sources.changed or bootstrap_apt_sources_legacy.changed

- name: Ensure Ansible prerequisites are installed
  ansible.builtin.apt:
    name:
      # Provides `setfacl` — Ansible needs POSIX ACLs to hand temp files off
      # to unprivileged users when using `become_user`. Without it,
      # `become_user: <non-root>` fails on minimal images.
      - acl
      - nfs-common              # for mounting rdsi
    state: present
    update_cache: true
    cache_valid_time: 3600

# When Ansible first creates /root/.ansible/tmp on its own it uses mode 0700,
# which stops non-root become_user tasks from traversing into per-task
# subdirs. Create it up-front with a traversable mode so ACLs on the leaf
# files (handled by the `acl` package above) are enough.
- name: Pre-create root's Ansible temp dir with traversable permissions
  ansible.builtin.file:
    path: /root/.ansible/tmp
    state: directory
    owner: root
    group: root
    mode: '0755'
