---
# Parent directory that every instance's checkout lives under, on the target
# host, as the dagster user.
dagster_instances_root: "/home/{{ dagster_user }}/dagster-instances"

# List of instances to deploy. See group_vars for the expected shape; empty
# by default so a play with no user config makes no changes here.
dagster_instances: []

# --- Private repo / registry access -----------------------------------------
# All empty by default: a public repo and public images need no credentials,
# and an empty secret name skips every credential task.

# One GitHub App installation covers both the clones (contents: read) and the
# ghcr.io image pulls (packages: read), replacing the old deploy-key + classic
# PAT pair. Its private key mints installation tokens that are read-only,
# scoped to the repos the installation grants, and expire after an hour — so
# tokens are minted on-host at pull time (see github-app-token.sh.j2) rather
# than installed by this role. Requires the instance `repo:` URLs to be
# HTTPS, not SSH.
#
# App ID and installation IDs are not secrets: the app's settings page shows
# the former, each installation's URL (…/settings/installations/<id>) the
# latter.
dagster_github_app_id: ""

# Map of repo/package owner -> the app's installation id on that account.
# Installations are per GitHub *account*, so instance repos owned by
# different users/orgs need the app installed on each; one entry then covers
# every repo that installation grants. When the map has exactly one entry it
# doubles as the default owner wherever one can't be named.
dagster_github_app_installations: {}

# Barbican secret holding the App's PEM private key.
dagster_github_app_key_secret_name: ""
dagster_github_app_key_path: "/home/{{ dagster_user }}/.config/github-app/key.pem"

# The mint-and-cache script, which also backs both credential helpers. In the
# dagster user's home — this role has no root on the target, so nothing can
# go in /usr/local/bin. podman resolves `credHelpers` entries against the
# PATH of the pulling process, and the systemd user units get a default PATH
# without ~/.local/bin, so the role also installs per-unit drop-ins that
# prepend it (see unit-path.conf.j2). dagster_home_dir is a fact set at the
# top of tasks/main.yml; defaults are evaluated lazily, so referencing it
# here is fine and spares a group_vars override for the /srv home.
dagster_github_app_token_helper: "{{ dagster_home_dir }}/.local/bin/github-app-token"

dagster_registry: ghcr.io

# Barbican secret holding the private half of the keypair whose public half
# the processing_user role installs on the Nectar processing VM. Written next
# to each instance checkout so the containers can SSH into that VM; the
# instance's NECTAR_SSH_KEY env var should point at the file's in-container
# path. Empty skips the install.
dagster_nectar_ssh_key_secret_name: ""
