---
# Parent directory that every instance's checkout lives under, on the target
# host, as the dagster user.
dagster_instances_root: "/home/{{ dagster_user }}/dagster-instances"

# List of instances to deploy. See group_vars for the expected shape; empty
# by default so a play with no user config makes no changes here.
dagster_instances: []

# --- Private repo / registry access -----------------------------------------
# All empty by default: a public repo and public images need no credentials,
# and an empty token secret name skips every credential task.

# Gitea uses one identity for both git-over-HTTPS and its container
# registry, so a single bot user with a read-only access token covers the
# clones and the image pulls. Gitea has no SSH access on our host and no
# short-lived machine tokens (nothing like a GitHub App installation token),
# so the token itself is the durable credential: it lives in Barbican and the
# role renders it into git's and podman's stock credential files, which
# `tedisc-deploy@<name>.timer` then uses long after the play has finished.
# Requires the instance `repo:` URLs to be HTTPS.
#
# The bot user whose token is used. Not a secret. The user must be a member
# of (or collaborator on) every owner whose repos/images the instances need;
# token scopes only restrict what membership already grants.
dagster_gitea_user: ""

# Barbican secret holding the bot user's access token (scopes:
# read:repository, read:package).
dagster_gitea_token_secret_name: ""

# Hostname (no scheme; include the port if non-standard) of the Gitea
# instance. Gitea serves git and the container registry on the same host,
# so this scopes both the git credential and podman's registry auth. The
# instance `repo:` URLs and image paths are written out in full in
# group_vars and must use this host.
dagster_registry: ""

# Barbican secret holding the private half of the keypair whose public half
# the processing_user role installs on the Nectar processing VM. Written next
# to each instance checkout so the containers can SSH into that VM; the
# instance's NECTAR_SSH_KEY env var should point at the file's in-container
# path. Empty skips the install.
dagster_nectar_ssh_key_secret_name: ""
