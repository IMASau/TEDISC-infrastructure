---
# Trimmed then re-terminated: Barbican payloads may or may not carry a
# trailing newline, and ssh rejects a key file without one. The file sits untracked in the
# checkout (like .env below), which git pulls leave alone.
- name: "[{{ instance.name }}] Install the Nectar SSH private key"
  become_user: "{{ dagster_user }}"
  ansible.builtin.copy:
    content: "{{ lookup('openstack_secret', dagster_nectar_ssh_key_secret_name) | trim }}\n"
    dest: "{{ dagster_instances_root }}/{{ instance.name }}/nectar_ssh_key"
    owner: "{{ dagster_user }}"
    group: "{{ dagster_user }}"
    mode: '0600'
  no_log: true
  when: dagster_nectar_ssh_key_secret_name | length > 0

- name: "[{{ instance.name }}] Write .env file"
  become_user: "{{ dagster_user }}"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ dagster_instances_root }}/{{ instance.name }}/.env"
    owner: "{{ dagster_user }}"
    group: "{{ dagster_user }}"
    mode: '0600'

# Retired GitHub App plumbing: each unit instance used to carry its image
# owner in an environment drop-in. Gitea needs no owner resolution, so the
# drop-in directories go. Deletable once every managed host has run it.
- name: "[{{ instance.name }}] Remove retired GitHub App unit drop-ins"
  ansible.builtin.file:
    path: "{{ dagster_home_dir }}/.config/systemd/user/{{ item }}{{ instance.name }}.service.d"
    state: absent
  loop:
    - "tedisc@"
    - "tedisc-deploy@"
  notify: reload dagster user systemd

# Flush so the daemon-reload lands before the enable/start below spawns
# anything with a stale environment.
- name: "[{{ instance.name }}] Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "[{{ instance.name }}] Enable & start tedisc@{{ instance.name }}.service"
  become_user: "{{ dagster_user }}"
  ansible.builtin.systemd:
    name: "tedisc@{{ instance.name }}.service"
    state: started
    enabled: true
    scope: user
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ dagster_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ dagster_user_uid }}/bus"

- name: "[{{ instance.name }}] Enable & start tedisc-deploy@{{ instance.name }}.timer"
  become_user: "{{ dagster_user }}"
  ansible.builtin.systemd:
    name: "tedisc-deploy@{{ instance.name }}.timer"
    state: started
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ dagster_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ dagster_user_uid }}/bus"
