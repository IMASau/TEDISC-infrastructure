---
- name: Look up dagster user UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ dagster_user }}"

- name: Set dagster_user_uid fact
  ansible.builtin.set_fact:
    dagster_user_uid: "{{ getent_passwd[dagster_user][1] }}"

- name: Set dagster user home-dir
  ansible.builtin.set_fact:
    dagster_home_dir: "{{ getent_passwd[dagster_user][4] }}"

- name: Ensure the instances root exists
  ansible.builtin.file:
    path: "{{ dagster_instances_root }}"
    state: directory
    owner: "{{ dagster_user }}"
    group: "{{ dagster_user }}"
    mode: '0755'

- name: Ensure the user's systemd unit directory exists
  ansible.builtin.file:
    path: "{{ dagster_home_dir }}/.config/systemd/user"
    state: directory
    owner: "{{ dagster_user }}"
    group: "{{ dagster_user }}"
    mode: '0755'

# --- Private repo / registry credentials ------------------------------------
# One Gitea bot-user token covers both the clones and the image pulls: Gitea
# accepts the same access token for git-over-HTTPS and its container
# registry. The token is long-lived (Gitea tokens don't expire), and
# `tedisc-deploy@<name>.timer` re-pulls the repo and images long after this
# play has finished — so it goes into git's and podman's stock credential
# files, which both tools read on their own at pull time. Everything below
# must be in place before the clone tasks run.

- name: Ensure the Gitea configuration is complete
  ansible.builtin.assert:
    that:
      - dagster_registry | length > 0
      - dagster_gitea_user | length > 0
    fail_msg: >-
      dagster_gitea_token_secret_name is set but dagster_registry /
      dagster_gitea_user are not. See group_vars/all.yml.
  when: dagster_gitea_token_secret_name | length > 0

# Fetched once rather than looked up inside each template: one Barbican
# round-trip, and the templates stay free of lookup calls.
- name: Fetch the Gitea access token
  ansible.builtin.set_fact:
    dagster_gitea_token: "{{ lookup('openstack_secret', dagster_gitea_token_secret_name) | trim }}"
  no_log: true
  when: dagster_gitea_token_secret_name | length > 0

- name: Point git at the stored credential for the Gitea host
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ dagster_home_dir }}/.gitconfig"
    owner: "{{ dagster_user }}"
    group: "{{ dagster_user }}"
    mode: '0644'
  when: dagster_gitea_token_secret_name | length > 0

- name: Install the git credential for the Gitea host
  ansible.builtin.template:
    src: git-credentials.j2
    dest: "{{ dagster_home_dir }}/.git-credentials"
    owner: "{{ dagster_user }}"
    group: "{{ dagster_user }}"
    mode: '0600'
  no_log: true
  when: dagster_gitea_token_secret_name | length > 0

- name: Ensure the dagster user's registry auth directory exists
  ansible.builtin.file:
    path: "{{ dagster_home_dir }}/.docker"
    state: directory
    owner: "{{ dagster_user }}"
    group: "{{ dagster_user }}"
    mode: '0700'
  when: dagster_gitea_token_secret_name | length > 0

- name: Install the registry credential for podman
  ansible.builtin.template:
    src: docker-config.json.j2
    dest: "{{ dagster_home_dir }}/.docker/config.json"
    owner: "{{ dagster_user }}"
    group: "{{ dagster_user }}"
    mode: '0600'
  no_log: true
  when: dagster_gitea_token_secret_name | length > 0

# --- Retire the GitHub App machinery ----------------------------------------
# Until 2026-10 the host minted GitHub App installation tokens at pull time
# via a helper script, a podman credential-helper shim, and per-unit PATH
# drop-ins. None of that is wanted against Gitea. The drop-in directories
# only ever held files this role wrote, so removing them whole is safe.
# This block can be deleted once every managed host has run it.
- name: Remove retired GitHub App artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ dagster_home_dir }}/.config/github-app"
    - "{{ dagster_home_dir }}/.cache/github-app"
    - "{{ dagster_home_dir }}/.local/bin/github-app-token"
    - "{{ dagster_home_dir }}/.local/bin/docker-credential-github-app"
    - "{{ dagster_home_dir }}/.config/systemd/user/tedisc@.service.d"
    - "{{ dagster_home_dir }}/.config/systemd/user/tedisc-deploy@.service.d"
  notify: reload dagster user systemd

# First pass: clone every instance's repo. The systemd unit files come from
# one of these checkouts (they're identical across repos per the multi-
# instance contract), so all clones must complete before we install them.
- name: Clone each dagster instance
  become_user: "{{ dagster_user }}"
  ansible.builtin.git:
    repo: "{{ instance.repo }}"
    dest: "{{ dagster_instances_root }}/{{ instance.name }}"
    version: "{{ instance.branch | default('main') }}"
    # update: false     # deploy-update.sh handles subsequent pulls
  loop: "{{ dagster_instances }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.name }}"

# Install the templated systemd units (per the contract, every instance
# repo ships identical copies at scripts/tedisc*@.service/timer). Take the
# first instance's checkout as the canonical source.
- name: Install shared systemd unit templates
  ansible.builtin.copy:
    src: "{{ dagster_instances_root }}/{{ dagster_instances[0].name }}/scripts/{{ item }}"
    dest: "{{ dagster_home_dir }}/.config/systemd/user/{{ item }}"
    remote_src: true
    owner: "{{ dagster_user }}"
    group: "{{ dagster_user }}"
    mode: '0644'
  loop:
    - "tedisc@.service"
    - "tedisc-deploy@.service"
    - "tedisc-deploy@.timer"
  when: dagster_instances | length > 0
  notify: reload dagster user systemd

# Flush the daemon-reload before per-instance enables so the user manager
# has seen the new unit files.
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Provision each instance
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ dagster_instances }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.name }}"
